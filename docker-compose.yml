services:
  frontend:
    image: ghcr.io/gyrozepelix/portfolio-web:latest
    build:
      context: .
    networks:
      - traefik-public
    labels:
      - traefik.enable=true

      - traefik.http.routers.redirect-to-www.rule=Host(`dgjalic.com`)
      - traefik.http.routers.redirect-to-www.entrypoints=websecure
      - traefik.http.routers.redirect-to-www.tls.certresolver=myresolver
      - traefik.http.routers.redirect-to-www.priority=10
      - traefik.http.routers.redirect-to-www.middlewares=redirect-to-www

      - traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https://dgjalic\.com/(.*)
      - traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.dgjalic.com/$${1}
      - traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true

      - traefik.http.routers.frontend.rule=Host(`www.dgjalic.com`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=myresolver
      - traefik.http.services.frontend.loadbalancer.server.port=80
    restart: on-failure

networks:
  traefik:
    driver: bridge
    name: traefik-reverse-proxy
    external: true
